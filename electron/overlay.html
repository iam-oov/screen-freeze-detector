<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Select zones</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #000; cursor: crosshair;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #shot {
        position: absolute; inset: 0; width: 100vw; height: 100vh;
        display: block; user-select: none; -webkit-user-drag: none;
      }
      #bar {
        position: fixed; top: 0; left: 0; right: 0; z-index: 10;
        padding: 11px 16px; text-align: center;
        background: rgba(10, 10, 14, 0.72); color: #fff; font-size: 13px;
        letter-spacing: 0.2px; backdrop-filter: blur(4px);
      }
      #bar b { color: #f5365c; }
      .rect {
        position: absolute; border: 2px solid #39ff14;
        background: rgba(57, 255, 20, 0.12); pointer-events: none;
      }
      .rect .tag {
        position: absolute; top: -20px; left: 0;
        font-size: 11px; font-weight: 700; color: #0a0a0e;
        background: #39ff14; padding: 0 5px; border-radius: 3px;
      }
      .rect.edit { pointer-events: auto; cursor: move; }
      .rect.ref {
        border-color: #f5365c; border-style: dashed;
        background: rgba(245, 54, 92, 0.08); pointer-events: none;
      }
      .rect.ref .tag { background: #f5365c; color: #fff; }
      .handle {
        position: absolute; width: 10px; height: 10px;
        background: #39ff14; border: 1px solid #0a0a0e; border-radius: 2px;
        pointer-events: auto;
      }
      .handle[data-pos="nw"] { left: -6px; top: -6px; cursor: nwse-resize; }
      .handle[data-pos="n"]  { left: 50%; top: -6px; margin-left: -5px; cursor: ns-resize; }
      .handle[data-pos="ne"] { right: -6px; top: -6px; cursor: nesw-resize; }
      .handle[data-pos="e"]  { right: -6px; top: 50%; margin-top: -5px; cursor: ew-resize; }
      .handle[data-pos="se"] { right: -6px; bottom: -6px; cursor: nwse-resize; }
      .handle[data-pos="s"]  { left: 50%; bottom: -6px; margin-left: -5px; cursor: ns-resize; }
      .handle[data-pos="sw"] { left: -6px; bottom: -6px; cursor: nesw-resize; }
      .handle[data-pos="w"]  { left: -6px; top: 50%; margin-top: -5px; cursor: ew-resize; }
      #dot {
        position: absolute; display: none; pointer-events: none;
        width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%;
        background: #f5365c; border: 2px solid #fff;
      }
    </style>
  </head>
  <body>
    <img id="shot" alt="" />
    <div id="bar"></div>
    <div id="dot"></div>
    <script src="overlay.js"></script>
  </body>
</html>
