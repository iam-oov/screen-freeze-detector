<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>screensound — nut.js injection spike</title>
    <style>
      /* Same palette as the Python app, to preview the UI upside of Electron. */
      :root {
        --bg: #141422;
        --surface: #1c1c30;
        --input: #2a2a44;
        --accent: #e8651a;
        --text: #e8e8f0;
        --muted: #8888a0;
        --ok: #3ecf6a;
        --err: #e05050;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 20px;
        font-family: system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      h1 { font-size: 16px; margin: 0 0 4px; }
      p.sub { color: var(--muted); font-size: 12px; margin: 0 0 16px; }
      label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
      input {
        width: 100%;
        padding: 8px 10px;
        background: var(--input);
        border: 1px solid #34345a;
        border-radius: 6px;
        color: var(--text);
        font-size: 13px;
      }
      .row { display: flex; gap: 10px; }
      .row > div { flex: 1; }
      button {
        margin-top: 16px;
        width: 100%;
        padding: 11px;
        background: var(--accent);
        border: none;
        border-radius: 6px;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      #log {
        margin-top: 16px;
        padding: 12px;
        background: var(--surface);
        border-radius: 6px;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        min-height: 120px;
        white-space: pre-wrap;
      }
      .ok { color: var(--ok); }
      .err { color: var(--err); }
    </style>
  </head>
  <body>
    <h1>nut.js injection spike</h1>
    <p class="sub">
      Open a text app (e.g. TextEdit). Note where its text area is on screen,
      put those coordinates below, hit Run, then DON'T touch anything during the
      countdown. nut.js should click there and type the text.
    </p>

    <div class="row">
      <div><label>Target X</label><input id="x" type="number" value="600" /></div>
      <div><label>Target Y</label><input id="y" type="number" value="400" /></div>
    </div>
    <label>Text to type</label>
    <input id="text" value="screensound nut.js spike OK" />

    <button id="run">Run injection (5s countdown)</button>
    <div id="log">Ready.</div>

    <script src="renderer.js"></script>
  </body>
</html>
