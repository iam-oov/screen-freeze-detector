[project]
name = "screensound"
dynamic = ["version"]
description = "Detect frozen screen zones and react with sound, auto-Enter, or a Telegram remote control"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.1.1",
    "pydantic-settings>=2.14.1",
    "pynput>=1.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
only-include = ["freeze_detector.py", "config.py"]
